name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Registry image names must be lowercase; github.repository keeps the owner's case.
      - name: Compute image name
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # The Dockerfiles COPY this file (too large for git); the script verifies its SHA256.
      - name: Download scenario data
        run: bash scripts/download_scenarios.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build into the local daemon first so the scan gates publishing.
      - name: Build Shiny image
        uses: docker/build-push-action@67a2d409c0a876cbe6b11854e3e25193efe4e62d # v6.12.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: trisk-scan:${{ github.sha }}
          cache-from: type=gha,scope=trisk
          cache-to: type=gha,mode=max,scope=trisk

      - name: Scan Shiny image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: trisk-scan:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          image: trisk-scan:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: true

      # Same inputs as the scanned build, so this is served from the build cache.
      - name: Push Shiny image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@67a2d409c0a876cbe6b11854e3e25193efe4e62d # v6.12.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=trisk

      - name: Build CLI image
        uses: docker/build-push-action@67a2d409c0a876cbe6b11854e3e25193efe4e62d # v6.12.0
        with:
          context: .
          file: ./Dockerfile.cli
          load: true
          tags: trisk-cli-scan:${{ github.sha }}
          cache-from: type=gha,scope=trisk-cli
          cache-to: type=gha,mode=max,scope=trisk-cli

      - name: Scan CLI image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: trisk-cli-scan:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Push CLI image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@67a2d409c0a876cbe6b11854e3e25193efe4e62d # v6.12.0
        with:
          context: .
          file: ./Dockerfile.cli
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}-cli:latest
            ${{ env.IMAGE_NAME }}-cli:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=trisk-cli

  test:
    runs-on: ubuntu-22.04
    needs: build-and-push
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download scenario data
        run: bash scripts/download_scenarios.sh

      - name: Build test image
        run: docker build -t trisk-test:latest .

      - name: Test container starts
        run: |
          docker run -d --name test-container -p 127.0.0.1:3838:3838 trisk-test:latest
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:3838/ && break
            sleep 5
          done
          curl -fsS -o /dev/null http://localhost:3838/ || { docker logs test-container; exit 1; }
          docker logs test-container
          docker stop test-container
